<!doctype html>
<html lang="en" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShlimpNote</title>
  <meta name="theme-color" content="#b79de9">
  <meta name="darkreader-lock"><!-- keep the pastel look even where Dark Reader is installed -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Jungle behind everything (her ask, 2026-11-10); drawn by scene.js. Nothing here can be clicked. -->
    <div class="jungle-sky" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="scene scene-top" id="scene-top" aria-hidden="true"></div>
    <div class="scene scene-floor" id="scene-floor" aria-hidden="true"></div>
    <nav id="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="40" height="40">
        <span>ShlimpNote</span>
      </div>
      <div id="nav"></div>
      <button id="ask-btn" class="ask" data-go="ask">
        <span class="ask-icon">✎</span> Ask for a change
      </button>
      <button id="sync-line" class="sync-line" data-go="sync">Not connected</button>
    </nav>
    <main id="main">
      <header id="page-head">
        <h1 id="page-title"></h1>
        <div id="page-sub"></div>
      </header>
      <section id="page"></section>
    </main>
  </div>
  <!-- PIN lock (his ask, 2026-11-11): a screen in the page, not a pop-up. Driven by Lock in app.js. -->
  <div id="lock">
    <div class="card lock-card">
      <img src="icons/icon.svg" alt="" width="64" height="64">
      <h2 data-title>Getting ready…</h2>
      <div class="lock-sub" data-sub></div>
      <div class="pin-dots"><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i></div>
      <div class="pin-pad" data-pad hidden>
        <button class="btn" data-k="1">1</button><button class="btn" data-k="2">2</button><button class="btn" data-k="3">3</button>
        <button class="btn" data-k="4">4</button><button class="btn" data-k="5">5</button><button class="btn" data-k="6">6</button>
        <button class="btn" data-k="7">7</button><button class="btn" data-k="8">8</button><button class="btn" data-k="9">9</button>
        <span></span><button class="btn" data-k="0">0</button><button class="btn" data-k="back" aria-label="Delete">⌫</button>
      </div>
      <button class="link" data-forgot hidden>Forgot it?</button>
      <div class="row lock-reset" data-reset hidden><input class="field" placeholder="Paste your connect code" autocomplete="off"><button class="btn">Make a new PIN</button></div>
      <button class="link" data-cancel hidden>Cancel</button>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
