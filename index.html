<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShlimpNote</title>
  <meta name="theme-color" content="#b79de9">
  <meta name="darkreader-lock"><!-- keep the pastel look even where Dark Reader is installed -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Jungle behind everything (her ask, 2026-11-10); drawn by scene.js. Nothing here can be clicked. -->
    <div class="jungle-sky" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="scene scene-top" id="scene-top" aria-hidden="true"></div>
    <div class="scene scene-floor" id="scene-floor" aria-hidden="true"></div>
    <nav id="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="40" height="40">
        <span>ShlimpNote</span>
      </div>
      <div id="nav"></div>
      <button id="ask-btn" class="ask" data-go="ask">
        <span class="ask-icon">✎</span> Ask for a change
      </button>
      <button id="sync-line" class="sync-line" data-go="sync">Not connected</button>
    </nav>
    <main id="main">
      <header id="page-head">
        <h1 id="page-title"></h1>
        <div id="page-sub"></div>
      </header>
      <section id="page"></section>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
